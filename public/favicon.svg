<?xml version="1.0" standalone="no"?>
<svg id="keycap-svg" width="280" height="280" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop id="frameStop1" offset="0%" stop-color="#4C1D95"></stop>
                            <stop id="frameStop2" offset="100%" stop-color="#0d1f55"></stop>
                        </linearGradient>
                        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
                            <stop id="bodyStop1" offset="0%" stop-color="#c7e2ea"></stop>
                            <stop id="bodyStop2" offset="100%" stop-color="#5da3ba"></stop>
                        </linearGradient>
                        <linearGradient id="topGrad" x1="0" y1="0" x2="1" y2="1">
                            <stop id="topStop1" offset="0%" stop-color="#f5f5f5"></stop>
                            <stop id="topStop2" offset="100%" stop-color="#dcdcdc"></stop>
                        </linearGradient>
                        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"></feDropShadow>
                        </filter>
                    </defs>

                    <!-- Outer frame -->
                    <rect x="10" y="10" width="340" height="340" rx="55" fill="url(#frameGrad)" filter="url(#shadow)"></rect>
                    <!-- Inner body -->
                    <rect x="30" y="20" width="300" height="300" rx="45" fill="url(#bodyGrad)"></rect>
                    <!-- Top key surface -->
                    <rect x="75" y="30" width="210" height="210" rx="35" fill="url(#topGrad)"></rect>

                    <!-- “R” glyph -->
                    <path id="glyph-path" d="M145 110 Q145 95 160 95 L215 95 Q250 95 250 130 Q250 160 225 170 L245 200 Q255 215 235 225 Q220 230 210 215 L190 185 L175 185 L175 215 Q175 230 160 230 Q145 230 145 215 Z M175 120 L175 160 L205 160 Q225 160 225 140 Q225 120 205 120 Z" fill="#4C1D95"></path>
                </svg>